[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kenken"
version = "0.1.0"
description = "Deterministic KenKen puzzle generation, verification, and rendering"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "KenKen contributors" }]
dependencies = []

[project.scripts]
kenken = "kenken.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "jsonschema>=4.23",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kenken"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
